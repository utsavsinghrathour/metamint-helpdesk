name: Deploy from Release Tag

on:
  workflow_run:
    workflows: ["Robodesk Plugin Auto Release (main)"]
    types:
      - completed


jobs:
  deploy:
    name: Update Changes on server
    runs-on: ubuntu-latest

    steps:
      - name: Download release asset
        run: |
          gh release download --pattern "metamint-helpdesk.zip" --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ZIP File to Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "metamint-helpdesk.zip"
          target: "${{ secrets.PROJECT_GIT_PATH }}"

      - name: Extract ZIP on Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            DEST_PATH="${{secrets.PROJECT_GIT_PATH}}"
            ZIP_NAME="metamint-helpdesk.zip"

            cd "$DEST_PATH"

            CURRENT_DIR=$(basename "$PWD")
            if [ "$CURRENT_DIR" = "metamint-helpdesk" ]; then
              echo "📂 We are inside the 'metamint-helpdesk' folder. Moving zip to parent directory and shifting context..."
              mv "$ZIP_NAME" ../
              cd ..
            fi

            echo "🧹 Cleaning old files..."
            rm -rf metamint-helpdesk

            echo "📦 Extracting ZIP..."
            unzip -o "$ZIP_NAME"

            echo "🗑 Removing ZIP..."
            rm -f "$ZIP_NAME"

            echo "✅ Deployment complete!"
      - name: Change ownership of files on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd "/www/wwwroot/robo-desk.codepixelz.tech/wp-content/plugins/"

            echo "🔐 Fixing ownership..."
            chown -R www:www metamint-helpdesk

            echo "✅ Deployment complete!"
